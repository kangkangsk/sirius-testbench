<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sirius 自动化测试工作台 Logo</title>
  <desc id="desc">蓝色渐变星体 Logo，包含明亮星轨和放大的主星。</desc>
  <defs>
    <linearGradient id="bg" x1="36" y1="24" x2="204" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D8BFF"/>
      <stop offset="0.52" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#32D7C6"/>
    </linearGradient>
    <linearGradient id="orbit" x1="24" y1="116" x2="216" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DEEFF" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7CE4FF" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="6" y="6" width="228" height="228" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1769D7" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-20" y="-20" width="280" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="34" y="34" width="172" height="172" rx="48" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="49" y="49" width="142" height="142" rx="38" fill="white" fill-opacity="0.12"/>
  <circle cx="120" cy="120" r="56" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M47 132C69 87 164 69 204 102C228 122 202 154 147 163C97 171 40 158 30 135C23 119 33 103 55 91" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M47 132C69 87 164 69 204 102C228 122 202 154 147 163C97 171 40 158 30 135C23 119 33 103 55 91" stroke="url(#orbit)" stroke-width="12" stroke-linecap="round"/>
  <path d="M187 55L198 80L225 91L198 102L187 129L176 102L149 91L176 80L187 55Z" fill="#FFFFFF" filter="url(#glow)"/>
  <path d="M187 68L194 84L211 91L194 98L187 116L180 98L163 91L180 84L187 68Z" fill="#BDF9FF"/>
  <circle cx="126" cy="122" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="126" cy="122" r="8" fill="#FFFFFF" fill-opacity="0.82"/>
  <path d="M61 50L68 65L84 72L68 79L61 95L54 79L38 72L54 65L61 50Z" fill="#C5F7FF" fill-opacity="0.92"/>
</svg>
