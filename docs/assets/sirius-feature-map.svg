<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sirius 功能总览图</title>
  <desc id="desc">展示工作空间、抓包会话、请求整理、登录态替换、回放测试、压力测试和脚本导出的功能关系。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1180" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FAFF"/>
      <stop offset="1" stop-color="#EEF7FF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F9FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1887FF"/>
      <stop offset="1" stop-color="#36D1C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1467C8" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#3C7DD9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1180" height="620" rx="32" fill="url(#panel)"/>
  <text x="64" y="76" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800" fill="#16243A">Sirius 自动化测试工作台</text>
  <text x="64" y="116" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5C718D">从真实浏览器操作沉淀 HTTP 抓包、回放批次、压测报告和脚本资产</text>

  <rect x="64" y="164" width="236" height="130" rx="20" fill="url(#card)" stroke="#D5E7FA" filter="url(#shadow)"/>
  <circle cx="104" cy="210" r="22" fill="url(#blue)"/>
  <path d="M93 211H115M104 200V222" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <text x="138" y="204" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182538">工作空间</text>
  <text x="138" y="238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">本地文件落盘</text>
  <text x="138" y="263" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">会话、配置、报告统一管理</text>

  <rect x="472" y="150" width="236" height="148" rx="20" fill="url(#card)" stroke="#D5E7FA" filter="url(#shadow)"/>
  <circle cx="512" cy="198" r="22" fill="url(#blue)"/>
  <rect x="500" y="187" width="24" height="20" rx="4" stroke="white" stroke-width="3"/>
  <path d="M505 216H519" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="546" y="193" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182538">抓包会话</text>
  <text x="546" y="226" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">有界面 Chromium</text>
  <text x="546" y="251" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">HTTP 与静态资源分流</text>
  <text x="546" y="276" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">原始 Header/Cookie/Body 保留</text>

  <rect x="880" y="164" width="236" height="130" rx="20" fill="url(#card)" stroke="#D5E7FA" filter="url(#shadow)"/>
  <circle cx="920" cy="210" r="22" fill="url(#blue)"/>
  <path d="M908 203H932M908 211H932M908 219H924" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="954" y="204" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182538">请求整理</text>
  <text x="954" y="238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">筛选、启停、删除</text>
  <text x="954" y="263" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">增删改查与状态码过滤</text>

  <rect x="268" y="382" width="236" height="138" rx="20" fill="url(#card)" stroke="#D5E7FA" filter="url(#shadow)"/>
  <circle cx="308" cy="430" r="22" fill="url(#blue)"/>
  <path d="M300 430L306 436L318 422" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="424" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182538">登录态替换</text>
  <text x="342" y="458" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">Cookie/Header 覆盖</text>
  <text x="342" y="483" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">目标 IP、端口、替换规则</text>

  <rect x="626" y="382" width="236" height="138" rx="20" fill="url(#card)" stroke="#D5E7FA" filter="url(#shadow)"/>
  <circle cx="666" cy="430" r="22" fill="url(#blue)"/>
  <path d="M658 419L676 430L658 441V419Z" fill="white"/>
  <text x="700" y="424" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182538">回放测试</text>
  <text x="700" y="458" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">后台批次顺序执行</text>
  <text x="700" y="483" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">实时进展、停止、单接口重测</text>

  <rect x="880" y="382" width="236" height="138" rx="20" fill="url(#card)" stroke="#D5E7FA" filter="url(#shadow)"/>
  <circle cx="920" cy="430" r="22" fill="url(#blue)"/>
  <path d="M910 442L916 430L924 435L932 416" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="954" y="424" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182538">压力测试</text>
  <text x="954" y="458" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">接口加入压测目标</text>
  <text x="954" y="483" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5E738C">成功率、TPS、耗时分布报告</text>

  <path d="M300 229H462" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M708 229H870" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M998 294V364" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M880 450H872" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round"/>
  <path d="M626 450H514" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M504 450H616" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M744 382C750 332 803 302 880 278" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <rect x="64" y="382" width="142" height="138" rx="20" fill="#EAF4FF" stroke="#BBD9FA"/>
  <text x="92" y="430" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E4F8F">脚本导出</text>
  <text x="91" y="462" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5E738C">生成 curl</text>
  <text x="91" y="486" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5E738C">便于 CI 接入</text>
  <path d="M880 500C640 572 348 567 206 492" stroke="#3C7DD9" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
</svg>
